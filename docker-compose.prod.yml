services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: healthyfrog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/healthyfrog
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gemini-2.0-flash}"
      AI_VISION_MODEL: "${AI_VISION_MODEL:-}"
      AI_AUDIO_MODEL: "${AI_AUDIO_MODEL:-}"
      GEMINI_API_CLASSIFY_KEY: "${GEMINI_API_CLASSIFY_KEY:-}"
      GEMINI_API_READ_LABEL_KEY: "${GEMINI_API_READ_LABEL_KEY:-}"
      GEMINI_API_IDENTIFY_FOOD_KEY: "${GEMINI_API_IDENTIFY_FOOD_KEY:-}"
      GEMINI_API_ESTIMATE_WEIGHT_KEY: "${GEMINI_API_ESTIMATE_WEIGHT_KEY:-}"
      GEMINI_API_ESTIMATE_KBJU_KEY: "${GEMINI_API_ESTIMATE_KBJU_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:
