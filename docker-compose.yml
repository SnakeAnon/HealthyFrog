services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthyfrog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/healthyfrog
      SECRET_KEY: super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "259200"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gemini-2.0-flash}"
      AI_VISION_MODEL: "${AI_VISION_MODEL:-}"
      AI_AUDIO_MODEL: "${AI_AUDIO_MODEL:-}"
      GEMINI_API_CLASSIFY_KEY: "${GEMINI_API_CLASSIFY_KEY:-}"
      GEMINI_API_READ_LABEL_KEY: "${GEMINI_API_READ_LABEL_KEY:-}"
      GEMINI_API_IDENTIFY_FOOD_KEY: "${GEMINI_API_IDENTIFY_FOOD_KEY:-}"
      GEMINI_API_ESTIMATE_WEIGHT_KEY: "${GEMINI_API_ESTIMATE_WEIGHT_KEY:-}"
      GEMINI_API_ESTIMATE_KBJU_KEY: "${GEMINI_API_ESTIMATE_KBJU_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_TRANSCRIPTION_MODEL: "${OPENROUTER_TRANSCRIPTION_MODEL:-whisper-1}"
      # TEMP: PolzaAI regional workaround (takes priority when key is set)
      POLZA_API_KEY: "${POLZA_API_KEY:-}"
      POLZA_BASE_URL: "${POLZA_BASE_URL:-https://polza.ai/api/v1}"
      POLZA_TRANSCRIPTION_MODEL: "${POLZA_TRANSCRIPTION_MODEL:-whisper-1}"
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data:
