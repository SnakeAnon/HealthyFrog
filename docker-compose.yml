# Формат 3.3 — максимальная совместимость со старым `docker-compose` (v1.x),
# который не понимает 3.8+ и ругается на "unsupported version".
# В 3.3 нет `depends_on: condition: service_healthy`, поэтому backend
# стартует сразу после контейнера db; при гонке первого коннекта —
# `restart: on-failure` перезапустит контейнер после миграций/uvicorn.
version: "3.3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthyfrog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/healthyfrog
      SECRET_KEY: super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data:
